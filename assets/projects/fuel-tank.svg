<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Fuel tank monitoring dashboard: tank level, weekly consumption and alerts">
<defs>
  <radialGradient id="ga" cx=".1" cy=".15" r=".6"><stop offset="0" stop-color="#4a7058" stop-opacity=".5"/><stop offset="1" stop-color="#4a7058" stop-opacity="0"/></radialGradient>
  <radialGradient id="gb" cx=".95" cy=".3" r=".55"><stop offset="0" stop-color="#d9b256" stop-opacity=".5"/><stop offset="1" stop-color="#d9b256" stop-opacity="0"/></radialGradient>
  <radialGradient id="gc" cx=".55" cy="1.05" r=".7"><stop offset="0" stop-color="#c0655b" stop-opacity=".4"/><stop offset="1" stop-color="#c0655b" stop-opacity="0"/></radialGradient>
  <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8a68"/><stop offset="1" stop-color="#2f5a42"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#436a52" stop-opacity=".35"/><stop offset="1" stop-color="#436a52" stop-opacity="0"/></linearGradient>
  <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a98657"/><stop offset="1" stop-color="#7d6240"/></linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#463a26" flood-opacity=".2"/></filter>
  <filter id="sm" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#463a26" flood-opacity=".15"/></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#33503f" stroke-opacity=".07"/></pattern>
  <style>
    .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#322c21}
    .s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#6c6353}
    .m{font-family:Consolas,Menlo,'Courier New',monospace;fill:#8d8372;letter-spacing:1.6px}
    .w{fill:#fff}
  </style>
</defs>
<rect width="1600" height="1000" fill="#e9e1d3"/>
<rect width="1600" height="1000" fill="url(#ga)"/><rect width="1600" height="1000" fill="url(#gb)"/><rect width="1600" height="1000" fill="url(#gc)"/>
<rect width="1600" height="1000" fill="url(#grid)"/>

<g filter="url(#sh)"><rect x="250" y="130" width="1100" height="700" rx="48" fill="#fffdf8" fill-opacity=".78" stroke="#fff" stroke-width="2"/></g>
<circle cx="306" cy="190" r="9" fill="#b23b34" fill-opacity=".7"/><circle cx="338" cy="190" r="9" fill="#caa14a"/><circle cx="370" cy="190" r="9" fill="#436a52"/>
<text class="t" x="420" y="199" font-size="32" font-weight="600">Fuel Tank Monitor</text>
<text class="m" x="420" y="228" font-size="17">ESP32 · MQTT · LIVE</text>
<rect x="1170" y="168" width="136" height="44" rx="22" fill="#436a52" fill-opacity=".14"/><circle cx="1198" cy="190" r="6" fill="#3fa46a"/><text class="m" x="1214" y="196" font-size="16" style="fill:#33503f">ONLINE</text>
<rect x="316" y="270" width="250" height="500" rx="46" fill="#fff" fill-opacity=".7" stroke="#322c21" stroke-opacity=".22" stroke-width="3"/>
<clipPath id="tk"><rect x="316" y="270" width="250" height="500" rx="46"/></clipPath>
<g clip-path="url(#tk)"><rect x="316" y="440" width="250" height="340" fill="url(#liq)"/><path d="M316 440 Q379 416 441 440 T566 440 V474 H316Z" fill="#6ca884" fill-opacity=".55"/></g>
<text class="w" x="441" y="618" font-size="76" font-weight="700" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">68%</text>
<text class="w" x="441" y="664" font-size="19" text-anchor="middle" font-family="Consolas,Menlo,monospace" fill-opacity=".85" letter-spacing="1.6">DIESEL · 3,400 L</text>
<path d="M590 320H612M590 420H612M590 520H612M590 620H612M590 720H612" stroke="#322c21" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
<text class="t" x="690" y="300" font-size="26" font-weight="600">Consumption</text>
<text class="m" x="690" y="328" font-size="16">LAST 7 DAYS</text>
<path d="M690 420H1010M690 520H1010M690 620H1010M690 700H1010" stroke="#322c21" stroke-opacity=".12" stroke-width="2"/>
<path d="M690 640 C735 600 765 664 810 592 S905 470 955 524 S1005 430 1010 420 V700 H690Z" fill="url(#area)"/>
<path d="M690 640 C735 600 765 664 810 592 S905 470 955 524 S1005 430 1010 420" fill="none" stroke="#436a52" stroke-width="6" stroke-linecap="round"/>
<g fill="#fff" stroke="#436a52" stroke-width="5"><circle cx="690" cy="640" r="9"/><circle cx="810" cy="592" r="9"/><circle cx="955" cy="524" r="9"/><circle cx="1010" cy="420" r="9"/></g>
<g class="m" font-size="15"><text x="690" y="740">M</text><text x="743" y="740">T</text><text x="796" y="740">W</text><text x="849" y="740">T</text><text x="902" y="740">F</text><text x="955" y="740">S</text><text x="1008" y="740">S</text></g>
<g filter="url(#sm)"><rect x="1050" y="262" width="250" height="130" rx="30" fill="#fff" fill-opacity=".8"/><rect x="1050" y="412" width="250" height="130" rx="30" fill="#fff" fill-opacity=".8"/><rect x="1050" y="562" width="250" height="130" rx="30" fill="#fff" fill-opacity=".8"/></g>
<text class="t" x="1080" y="332" font-size="42" font-weight="700">3,400 L</text><text class="m" x="1080" y="366" font-size="15">VOLUME</text>
<text class="t" x="1080" y="482" font-size="42" font-weight="700">42 L/h</text><text class="m" x="1080" y="516" font-size="15">FLOW RATE</text>
<circle cx="1112" cy="627" r="22" fill="#3fa46a" fill-opacity=".2"/><path d="M1102 627l8 8 14-16" fill="none" stroke="#33503f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t" x="1148" y="624" font-size="30" font-weight="700">No leaks</text><text class="m" x="1148" y="656" font-size="15">SENSOR CHECK</text>
<rect x="1050" y="716" width="250" height="76" rx="26" fill="#b23b34" fill-opacity=".12"/>
<path d="M1096 770h30l-4-8v-14a11 11 0 0 0-22 0v14z" fill="#b23b34" fill-opacity=".85"/>
<text class="t" x="1142" y="762" font-size="24" font-weight="600" style="fill:#8f2d27">Alert at 15%</text>
</svg>
